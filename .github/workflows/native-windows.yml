name: Windows and Android build
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/**'
      - 'android/**'
      - 'server/**'
      - 'tests/**'
      - 'collection-plugins/**'
      - 'scripts/**'
      - '.github/workflows/native-windows.yml'
      - '.github/workflows/android.yml'
      - '.github/scripts/**'
      - 'yt-dlp.exe'
      - 'assets/**'
  # Any change pushed to main is a release candidate, including docs-only commits.
  push:
    branches: [main]

# Untrusted pull request builds must not get a release-write token.
permissions:
  contents: read

jobs:
  android:
    uses: ./.github/workflows/android.yml

  server:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test the server and update service
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          if ! command -v ffmpeg || ! command -v ffprobe; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
          python -m pip install -r server/requirements.runtime.txt
          python -m unittest discover -s server/tests -v
          node --check server/static/app.js
          bash -n server/install-updater.sh
      - name: Validate the Compose configurations
        env:
          VD_SERVER_PASSWORD: docker-ci-fixture-password
          VD_PUBLIC_ADDRESS: downloads.example.test
          VD_SERVER_VERSION: v3.0.0
        run: |
          docker compose -f server/compose.yaml config --quiet
          docker compose -f server/compose.yaml -f server/compose.updater.yaml config --quiet
          docker compose -f server/compose.yaml -f server/compose.https.yaml -f server/compose.updater.yaml config --quiet
      - name: Start the server container and check its web interface
        env:
          VD_SERVER_PASSWORD: docker-ci-fixture-password
          VD_LOCAL_PORT: '18081'
        run: |
          compose=(docker compose -p video-downloader-ci -f server/compose.yaml)
          trap '"${compose[@]}" down --volumes' EXIT
          "${compose[@]}" up -d --build --wait --wait-timeout 45
          curl --fail --silent --show-error --retry 8 --retry-connrefused --max-time 4 \
            --user "downloader:$VD_SERVER_PASSWORD" http://127.0.0.1:18081/api/update
          curl --fail --silent --show-error --max-time 4 --output /dev/null \
            --user "downloader:$VD_SERVER_PASSWORD" http://127.0.0.1:18081/static/app.js

  native:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          # Release-history integration tests use the immutable migration anchor.
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Prepare WPF stack diagnostics
        shell: pwsh
        run: |
          $diagnosticTools = Join-Path $env:RUNNER_TEMP 'vd-diagnostic-tools'
          dotnet tool install dotnet-stack --version 8.0.547301 --tool-path $diagnosticTools
          if ($LASTEXITCODE -ne 0) { throw 'Cannot prepare the pinned WPF stack reporter.' }
          $stackReporter = Join-Path $diagnosticTools 'dotnet-stack.exe'
          & $stackReporter --version
          if ($LASTEXITCODE -ne 0) { throw 'The WPF stack reporter could not start.' }
          "VD_NATIVE_UI_STACK_TOOL=$stackReporter" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Prepare FFmpeg for real media integration tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue) -or -not (Get-Command ffprobe -ErrorAction SilentlyContinue)) {
            choco install ffmpeg --version=7.1.1 --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'FFmpeg test dependency installation failed.' }
            $env:PATH = "C:\ProgramData\chocolatey\bin;$env:PATH"
          }
          ffmpeg -version
          if ($LASTEXITCODE -ne 0) { throw 'FFmpeg is unavailable for media tests.' }
          ffprobe -version
          if ($LASTEXITCODE -ne 0) { throw 'ffprobe is unavailable for media tests.' }
      - name: Early Windows WPF regression tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet build tests/VideoDownloader.Tests/VideoDownloader.Tests.csproj -c Release
          if ($LASTEXITCODE -ne 0) { throw 'Native fixture build failed.' }
          dotnet build tests/VideoDownloader.UiTests/VideoDownloader.UiTests.csproj -c Release
          if ($LASTEXITCODE -ne 0) { throw 'WPF test build failed.' }
          pwsh -NoProfile -File ./scripts/ui-tests.ps1 -Scene SubscriptionInitialActions -ResultPath (Join-Path $env:RUNNER_TEMP 'initial-actions-probe/native-ui-result.txt')
          if ($LASTEXITCODE -ne 0) { throw 'Focused subscription WPF probe failed.' }
          pwsh -NoProfile -File ./scripts/ui-tests.ps1 -Scene All -ResultPath (Join-Path $env:RUNNER_TEMP 'early-windows-ui/native-ui-result.txt')
          if ($LASTEXITCODE -ne 0) { throw 'Early Windows WPF regression tests failed.' }
      - name: Pornhub collector with the bundled yt-dlp API
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python -m pip install yt-dlp==2026.08.19
          python tests/pornhub-collector-tests.py
      - name: Native build, contract, security and real WPF tests
        shell: pwsh
        run: pwsh -NoProfile -File ./scripts/build.ps1 -Task Test
      - name: Upload subscription progress preview
        uses: actions/upload-artifact@v4
        with:
          name: Subscription-progress-preview
          path: ${{ runner.temp }}/subscription-progress.png
          if-no-files-found: error
      - name: Upload waveform rendering diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Waveform-rendering-diagnostics
          path: ${{ runner.temp }}/media-waveform-window.png
          if-no-files-found: ignore
          retention-days: 3
      - name: Publish native portable EXE
        shell: pwsh
        run: pwsh -NoProfile -File ./scripts/build.ps1 -Task Publish
      - name: Verify portable updater handoff and restart
        shell: pwsh
        run: |
          dotnet run --no-build --configuration Release --project tests/VideoDownloader.Tests -- --published-app-update-smoke dist/native
          if ($LASTEXITCODE -ne 0) { throw 'The published portable updater smoke test failed.' }
      - uses: actions/upload-artifact@v4
        with:
          name: VideoDownloader-native-windows
          path: |
            dist/VideoDownloader-native.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error


  release:
    name: Publish GitHub Release from main
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: [native, android, server]
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: write
    # Preserve every ready release; completion order does not assign versions.
    concurrency:
      group: video-downloader-main-release
      cancel-in-progress: false
      queue: max
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Select deterministic main revision version
        id: version
        shell: pwsh
        run: |
          pwsh -NoProfile -File ./scripts/select-main-release.ps1 -TargetSha $env:GITHUB_SHA -OutputPath $env:GITHUB_OUTPUT
      - name: Inspect existing release ownership and completeness
        id: existing
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pwsh -NoProfile -File ./scripts/publish-main-release.ps1 -Mode Inspect -Repository $env:GITHUB_REPOSITORY -Tag '${{ steps.version.outputs.tag }}' -CommitSha $env:GITHUB_SHA -OutputPath $env:GITHUB_OUTPUT
      - uses: actions/setup-java@v4
        if: steps.existing.outputs.published != 'true'
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        if: steps.existing.outputs.published != 'true'
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        if: steps.existing.outputs.published != 'true'
      - name: Compile release package with matching EXE version
        if: steps.existing.outputs.published != 'true'
        shell: pwsh
        run: |
          pwsh -NoProfile -File ./scripts/build.ps1 -Task Publish -Version '${{ steps.version.outputs.version }}' -OutputDirectory dist/release -ArchivePath dist/VideoDownloader-Windows-x64.zip -ChecksumPath dist/SHA256SUMS.txt
      - name: Build and verify signed Android release
        if: steps.existing.outputs.published != 'true'
        shell: pwsh
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: pwsh -NoProfile -File ./scripts/build-android-release.ps1 -Version '${{ steps.version.outputs.version }}'
      - name: Prepare checksums and Android notices
        if: steps.existing.outputs.published != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $files = @('VideoDownloader-Windows-x64.zip', 'VideoDownloader-Android.apk')
          $checksums = foreach ($file in $files) {
            $hash = (Get-FileHash -LiteralPath (Join-Path dist $file) -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $file"
          }
          $checksums | Set-Content -LiteralPath dist/SHA256SUMS.txt -Encoding utf8
          Copy-Item android/THIRD_PARTY_NOTICES.md dist/THIRD_PARTY_NOTICES.md
          Copy-Item android/licenses/youtubedl-android-GPL-3.0.txt dist/youtubedl-android-GPL-3.0.txt
      - name: Publish or resume owned GitHub Release
        if: steps.existing.outputs.published != 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pwsh -NoProfile -File ./scripts/publish-main-release.ps1 -Mode Publish -Repository $env:GITHUB_REPOSITORY -Tag '${{ steps.version.outputs.tag }}' -CommitSha $env:GITHUB_SHA
