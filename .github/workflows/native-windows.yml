name: Windows and Android build
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/**'
      - 'android/**'
      - 'tests/**'
      - 'collection-plugins/**'
      - 'scripts/**'
      - '.github/workflows/native-windows.yml'
      - '.github/workflows/android.yml'
      - '.github/scripts/ReleaseVersion.psm1'
      - 'yt-dlp.exe'
      - 'assets/**'
  # Any change pushed to main is a release candidate, including docs-only commits.
  push:
    branches: [main]

# Untrusted pull request builds must not get a release-write token.
permissions:
  contents: read

jobs:
  android:
    uses: ./.github/workflows/android.yml

  native:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Pornhub collector with the bundled yt-dlp API
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python -m pip install yt-dlp==2026.08.19
          python tests/pornhub-collector-tests.py
      - name: Native build, contract, security and real WPF tests
        shell: pwsh
        run: pwsh -NoProfile -File ./scripts/build.ps1 -Task Test
      - name: Upload subscription progress preview
        uses: actions/upload-artifact@v4
        with:
          name: Subscription-progress-preview
          path: ${{ runner.temp }}/subscription-progress.png
          if-no-files-found: error
      - name: Publish native portable EXE
        shell: pwsh
        run: pwsh -NoProfile -File ./scripts/build.ps1 -Task Publish
      - uses: actions/upload-artifact@v4
        with:
          name: VideoDownloader-native-windows
          path: |
            dist/VideoDownloader-native.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error


  release:
    name: Publish GitHub Release from main
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [native, android]
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: write
    # Serialize tag generation so two main pushes cannot select the same tag.
    concurrency:
      group: video-downloader-main-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Select next stable version
        id: version
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git fetch origin --force --tags
          if ($LASTEXITCODE -ne 0) { throw "Cannot fetch Git tags" }
          Import-Module ./.github/scripts/ReleaseVersion.psm1 -Force
          [xml]$project = Get-Content ./src/VideoDownloader/VideoDownloader.csproj -Raw
          $baseline = [string]$project.Project.PropertyGroup.Version
          $tag = Get-VdNextReleaseTag -BaseVersion $baseline -ExistingTags @(git tag --list) -HeadTags @(git tag --points-at HEAD)
          if ($tag -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+$') { throw "Invalid release tag: $tag" }
          $version = $tag.Substring(1)
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Host "Release tag for commit $env:GITHUB_SHA is $tag"
      - name: Check for an existing release
        id: existing
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = '${{ steps.version.outputs.tag }}'
          $knownTag = git rev-list -n 1 $tag 2>$null
          if ($LASTEXITCODE -eq 0 -and $knownTag -ne $env:GITHUB_SHA) {
            throw "Tag $tag already points at another commit. Refusing to reassign it."
          }
          gh release view $tag --json tagName --jq .tagName 2>$null | Out-Null
          $exists = $LASTEXITCODE -eq 0
          "exists=$($exists.ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          if ($exists) { Write-Host "Release $tag already exists. Skipping idempotently." }
          exit 0
      - uses: actions/setup-java@v4
        if: steps.existing.outputs.exists != 'true'
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        if: steps.existing.outputs.exists != 'true'
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        if: steps.existing.outputs.exists != 'true'
      - name: Compile release package with matching EXE version
        if: steps.existing.outputs.exists != 'true'
        shell: pwsh
        run: |
          pwsh -NoProfile -File ./scripts/build.ps1 -Task Publish -Version '${{ steps.version.outputs.version }}' -OutputDirectory dist/release -ArchivePath dist/VideoDownloader-Windows-x64.zip -ChecksumPath dist/SHA256SUMS.txt
      - name: Build and verify signed Android release
        if: steps.existing.outputs.exists != 'true'
        shell: pwsh
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: pwsh -NoProfile -File ./scripts/build-android-release.ps1 -Version '${{ steps.version.outputs.version }}'
      - name: Prepare checksums and Android notices
        if: steps.existing.outputs.exists != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $files = @('VideoDownloader-Windows-x64.zip', 'VideoDownloader-Android.apk')
          $checksums = foreach ($file in $files) {
            $hash = (Get-FileHash -LiteralPath (Join-Path dist $file) -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $file"
          }
          $checksums | Set-Content -LiteralPath dist/SHA256SUMS.txt -Encoding utf8
          Copy-Item android/THIRD_PARTY_NOTICES.md dist/THIRD_PARTY_NOTICES.md
          Copy-Item android/licenses/youtubedl-android-GPL-3.0.txt dist/youtubedl-android-GPL-3.0.txt
      - name: Create public GitHub Release
        if: steps.existing.outputs.exists != 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = '${{ steps.version.outputs.tag }}'
          gh release create $tag 'dist/VideoDownloader-Windows-x64.zip#Windows x64 portable package' 'dist/VideoDownloader-Android.apk#Android release APK (arm64-v8a and x86_64)' 'dist/SHA256SUMS.txt#SHA-256 checksums' 'dist/THIRD_PARTY_NOTICES.md#Android third-party notices' 'dist/youtubedl-android-GPL-3.0.txt#Android runtime GPL-3.0 license' --target $env:GITHUB_SHA --title "Video Downloader $tag" --generate-notes --latest
          if ($LASTEXITCODE -ne 0) { throw "GitHub Release publication failed." }
