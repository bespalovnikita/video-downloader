name: Native C# Windows build
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'native/**'
      - 'native-tests/**'
      - 'ui/**'
      - '.github/workflows/native-windows.yml'
      - '.github/scripts/ReleaseVersion.psm1'
      - 'tests/release-version-tests.ps1'
      - 'yt-dlp.exe'
      - 'assets/**'
  # Any change pushed to main is a release candidate, including docs-only commits.
  push:
    branches: [main]

# Untrusted pull request builds must not get a release-write token.
permissions:
  contents: read

jobs:
  native:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Automatic release version tests
        shell: pwsh
        run: pwsh -NoProfile -File ./tests/release-version-tests.ps1
      - name: Build native C# WPF app
        run: dotnet build native/VideoDownloader.Native.csproj -c Release
      - name: Native WPF window startup smoke
        shell: pwsh
        timeout-minutes: 2
        run: pwsh -NoProfile -STA -File ./native-tests/gui-startup.ps1
      - name: Native WPF controls and checkpoint regression
        shell: pwsh
        timeout-minutes: 2
        run: |
          $env:VD_NATIVE_UI_TEST_RESULT = Join-Path $env:RUNNER_TEMP 'native-ui-result.txt'
          $exe = (Resolve-Path 'native/bin/Release/net8.0-windows/win-x64/VideoDownloader.exe').Path
          $app = Start-Process -FilePath $exe -ArgumentList '--ui-self-test' -Wait -PassThru
          if ($app.ExitCode -ne 0 -or -not (Test-Path -LiteralPath $env:VD_NATIVE_UI_TEST_RESULT)) {
            $lastStage = if (Test-Path -LiteralPath $env:VD_NATIVE_UI_TEST_RESULT) {
              Get-Content -LiteralPath $env:VD_NATIVE_UI_TEST_RESULT -Raw
            } else { '(no stage marker written)' }
            throw "Native WPF interaction regression failed: exit code $($app.ExitCode); last stage=$lastStage"
          }
          if ((Get-Content -LiteralPath $env:VD_NATIVE_UI_TEST_RESULT -Raw).Trim() -ne 'PASS') {
            throw 'Native WPF interaction regression did not pass'
          }
      - name: Native unit and filesystem security tests
        run: dotnet run --project native-tests/VideoDownloader.NativeTests.csproj -c Release
      - name: Publish native portable EXE
        shell: pwsh
        run: |
          dotnet publish native/VideoDownloader.Native.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true -o dist/native
          if ($LASTEXITCODE -ne 0) { throw "Native publish failed" }
          if (Get-ChildItem dist/native -Recurse -File -Include pwsh.exe,*.ps1,*.psm1) { throw "Native package unexpectedly includes PowerShell runtime/scripts" }
          Compress-Archive -Path dist/native/* -DestinationPath dist/VideoDownloader-native.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: VideoDownloader-native-windows
          path: dist/VideoDownloader-native.zip
          if-no-files-found: error


  release:
    name: Publish GitHub Release from main
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [native]
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: write
    # Serialize tag generation so two main pushes cannot select the same tag.
    concurrency:
      group: video-downloader-main-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Select next stable version
        id: version
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git fetch origin --force --tags
          if ($LASTEXITCODE -ne 0) { throw "Cannot fetch Git tags" }
          Import-Module ./.github/scripts/ReleaseVersion.psm1 -Force
          [xml]$project = Get-Content ./native/VideoDownloader.Native.csproj -Raw
          $baseline = [string]$project.Project.PropertyGroup.Version
          $tag = Get-VdNextReleaseTag -BaseVersion $baseline -ExistingTags @(git tag --list) -HeadTags @(git tag --points-at HEAD)
          if ($tag -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+$') { throw "Invalid release tag: $tag" }
          $version = $tag.Substring(1)
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Host "Release tag for commit $env:GITHUB_SHA is $tag"
      - name: Compile release package with matching EXE version
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = '${{ steps.version.outputs.version }}'
          dotnet publish native/VideoDownloader.Native.csproj -c Release -r win-x64 --self-contained true -p:Version=$version -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true -o dist/release
          if ($LASTEXITCODE -ne 0) { throw "Release build failed" }
          if (Get-ChildItem dist/release -Recurse -File -Include pwsh.exe,*.ps1,*.psm1) {
            throw "Refusing release with PowerShell runtime/scripts"
          }
          foreach ($required in @('VideoDownloader.exe','yt-dlp.exe','ui/MainWindow.xaml','ui/DuplicateDownloadDialog.xaml')) {
            if (-not (Test-Path -LiteralPath (Join-Path dist/release $required) -PathType Leaf)) {
              throw "Missing required release file: $required"
            }
          }
          Compress-Archive -Path dist/release/* -DestinationPath dist/VideoDownloader-Windows-x64.zip -Force
          $hash = (Get-FileHash dist/VideoDownloader-Windows-x64.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  VideoDownloader-Windows-x64.zip" | Set-Content dist/SHA256SUMS.txt -Encoding utf8
      - name: Create public GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = '${{ steps.version.outputs.tag }}'
          # Rerunning a job must not create a second release for the same SHA.
          gh release view $tag --json tagName --jq .tagName 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release $tag already exists. Skipping idempotently."
            exit 0
          }
          $knownTag = git rev-list -n 1 $tag 2>$null
          if ($LASTEXITCODE -eq 0 -and $knownTag -ne $env:GITHUB_SHA) {
            throw "Tag $tag already points at another commit. Refusing to reassign it."
          }
          gh release create $tag 'dist/VideoDownloader-Windows-x64.zip#Windows x64 portable package' 'dist/SHA256SUMS.txt#SHA-256 checksums' --target $env:GITHUB_SHA --title "Video Downloader $tag" --generate-notes --latest
          if ($LASTEXITCODE -ne 0) { throw "GitHub Release publication failed." }
