name: Build Windows EXE

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - feature/gui

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Core parser tests
        shell: pwsh
        run: ./tests/core-tests.ps1

      - name: Session checkpoint unit tests
        shell: pwsh
        run: pwsh -NoProfile -File ./tests/session-checkpoint-tests.ps1

      - name: Global download history tests
        shell: pwsh
        run: pwsh -NoProfile -File ./tests/download-history-tests.ps1

      - name: C# and PowerShell shared history, profiles and cleanup contracts
        shell: pwsh
        run: pwsh -NoProfile -File ./tests/cross-runtime-contract-tests.ps1

      - name: Manual subscriptions store and full hybrid scan
        shell: pwsh
        timeout-minutes: 4
        run: pwsh -NoProfile -File ./tests/subscription-tests.ps1

      - name: Subscription WPF controls and explicit queue integration
        shell: pwsh
        timeout-minutes: 3
        run: pwsh -NoProfile -STA -File ./tests/subscription-ui-tests.ps1

      - name: Preview metadata and thumbnail deadlines
        shell: pwsh
        run: pwsh -NoProfile -File ./tests/preview-deadline-tests.ps1

      - name: Live clipboard queue tests
        shell: pwsh
        run: pwsh -NoProfile -File ./tests/live-queue-tests.ps1

      - name: Per-URL cancellation tests
        shell: pwsh
        run: pwsh -NoProfile -File ./tests/cancellation-tests.ps1

      - name: Engine review regressions
        shell: pwsh
        run: pwsh -NoProfile -File ./tests/engine-review-regression-tests.ps1
        timeout-minutes: 3

      - name: GUI removal, recovery and settings regressions
        shell: pwsh
        run: pwsh -NoProfile -File ./tests/gui-review-regression-tests.ps1
        timeout-minutes: 2

      - name: File boundary security tests
        shell: pwsh
        run: pwsh -NoProfile -File ./tests/file-boundary-safety-tests.ps1

      - name: Tray and clipboard preview tests
        shell: pwsh
        run: pwsh -NoProfile -File ./tests/tray-preview-tests.ps1

      - name: Russian profiles and folder buttons
        shell: pwsh
        run: pwsh -NoProfile -File ./tests/russian-ui-tests.ps1

      - name: WPF and engine smoke checks
        shell: pwsh
        run: ./tests/smoke.ps1

      - name: Tray lifecycle regression tests
        shell: pwsh
        run: pwsh -NoProfile -STA -File ./tests/tray-lifecycle-tests.ps1
        timeout-minutes: 2

      - name: Windows progress, history and IPC regressions
        shell: pwsh
        run: pwsh -NoProfile -STA -File ./tests/windows-regression-tests.ps1
        timeout-minutes: 2

      - name: Offline real yt-dlp engine integration
        shell: pwsh
        run: pwsh -NoProfile -File ./tests/engine-integration-tests.ps1
        timeout-minutes: 2

      - name: Build portable EXE
        shell: pwsh
        run: ./build-exe.ps1

      - name: Upload portable package
        uses: actions/upload-artifact@v4
        with:
          name: VideoDownloader-windows
          path: dist/VideoDownloader-portable.zip
          if-no-files-found: error
