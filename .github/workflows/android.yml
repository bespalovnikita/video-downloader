name: Android Kotlin build

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests, debug and release lint, APKs
        working-directory: android
        run: ./gradlew --no-daemon -PvdVersionName=2.0.0 -PvdVersionCode=2000000 :core:test :app:testDebugUnitTest :app:lintDebug :app:lintRelease :app:assembleDebug :app:assembleDebugAndroidTest :app:assembleRelease
      - name: Verify release signing with a temporary test key
        shell: bash
        env:
          ANDROID_KEYSTORE_PASSWORD: ci-test-password
          ANDROID_KEY_ALIAS: ci-test-only
          ANDROID_KEY_PASSWORD: ci-test-password
        run: |
          signing_dir="$(mktemp -d "$RUNNER_TEMP/vd-android-test.XXXXXX")"
          cleanup() {
            rm -rf "$signing_dir"
            rm -f work/ci-android-release.apk
          }
          trap cleanup EXIT
          keytool -genkeypair -noprompt -keystore "$signing_dir/test.keystore" -storetype PKCS12 -alias "$ANDROID_KEY_ALIAS" -storepass:env ANDROID_KEYSTORE_PASSWORD -keypass:env ANDROID_KEY_PASSWORD -keyalg RSA -keysize 2048 -validity 2 -dname "CN=Video Downloader CI test only"
          export ANDROID_KEYSTORE_BASE64
          ANDROID_KEYSTORE_BASE64="$(base64 --wrap=0 "$signing_dir/test.keystore")"
          pwsh -NoProfile -File scripts/build-android-release.ps1 -Version 2.0.0 -OutputPath work/ci-android-release.apk
      - name: Enable the emulator hardware accelerator
        run: sudo chmod a+rw /dev/kvm
      - name: Android device tests
        id: device_tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: cd android && ./gradlew --no-daemon -PvdVersionName=2.0.0 -PvdVersionCode=2000000 :app:connectedDebugAndroidTest
      - name: Print failed Android test stack frames
        if: failure() && steps.device_tests.outcome == 'failure'
        working-directory: android
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          import xml.etree.ElementTree as ET

          budget = 128 * 1024
          def emit(line):
              global budget
              encoded = (line + '\n').encode('utf-8')
              if len(encoded) <= budget:
                  print(line)
                  budget -= len(encoded)

          def identifier(value):
              return value if re.fullmatch(r'[A-Za-z0-9_.$\[\] -]{1,256}', value) else '<redacted identifier>'

          frame = re.compile(r'\s*(?:at [A-Za-z0-9_.$<>/\-]+\([A-Za-z0-9_.$ :\-]+\)|\.\.\. \d+ more)\s*')
          cause = re.compile(r'\s*((?:Caused by: |Suppressed: )?)([A-Za-z0-9_.$]+(?:Exception|Error|Throwable))(?::|$)')
          total_bytes = failures = 0
          reports = Path('app/build/outputs/androidTest-results/connected').rglob('TEST-*.xml')
          for report in sorted(reports)[:64]:
              try:
                  size = report.stat().st_size
                  if size > 4 * 1024 * 1024 or total_bytes + size > 32 * 1024 * 1024:
                      emit('Skipped oversized Android test report')
                      continue
                  total_bytes += size
                  root = ET.parse(report).getroot()
              except (ET.ParseError, OSError):
                  emit('Could not parse an Android test report')
                  continue
              for case in root.iter('testcase'):
                  for failure in case.findall('failure') + case.findall('error'):
                      failures += 1
                      emit('FAILED ' + identifier(case.get('classname', '')) + '.' + identifier(case.get('name', '')))
                      emit('Exception type: ' + identifier(failure.get('type', 'unknown')))
                      # Assertion messages and system-out/system-err may contain
                      # URLs, clipboard text or credentials. Emit only code frames
                      # and exception classes, never arbitrary failure text.
                      for line in (failure.text or '').splitlines()[:512]:
                          if len(line) <= 1024 and frame.fullmatch(line):
                              emit(line.strip())
                          elif match := cause.match(line):
                              emit(match[1] + match[2])
          emit('Android test failures found: ' + str(failures))
          PY
      - name: Upload installable development APK
        uses: actions/upload-artifact@v4
        with:
          name: VideoDownloader-Android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Android-test-reports
          path: |
            android/core/build/reports/tests/
            android/app/build/reports/tests/
            android/app/build/reports/androidTests/
            android/app/build/reports/lint-results-debug.html
            android/app/build/reports/lint-results-release.html
            android/app/build/outputs/androidTest-results/
          if-no-files-found: warn
