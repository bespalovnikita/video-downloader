name: Android Kotlin build

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'android/**'
      - 'collection-plugins/**'
      - '.github/workflows/android.yml'
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'collection-plugins/**'
      - '.github/workflows/android.yml'

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests, lint and APK
        working-directory: android
        run: ./gradlew --no-daemon :core:test :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Enable the emulator hardware accelerator
        run: sudo chmod a+rw /dev/kvm
      - name: Android device tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: cd android && ./gradlew --no-daemon :app:connectedDebugAndroidTest
      - name: Upload installable development APK
        uses: actions/upload-artifact@v4
        with:
          name: VideoDownloader-Android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Android-test-reports
          path: |
            android/core/build/reports/tests/
            android/app/build/reports/tests/
            android/app/build/reports/androidTests/
            android/app/build/reports/lint-results-debug.html
            android/app/build/outputs/androidTest-results/
          if-no-files-found: warn
